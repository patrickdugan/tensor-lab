name: QC-02 quantum channel CPU tests
on:
  push:
    paths:
      - 'experiments/channel_mpo/**'
      - '.github/workflows/qc02-channel-tests.yml'
  pull_request:
    paths:
      - 'experiments/channel_mpo/**'
      - '.github/workflows/qc02-channel-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Run exact and purified channel tests
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        working-directory: experiments/channel_mpo
        run: python -m unittest -v test_channel_mpo test_purified_mpo
