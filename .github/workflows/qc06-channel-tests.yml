name: QC-06 adaptive purification regression

on:
  push:
    paths:
      - 'experiments/channel_mpo/**'
      - '.github/workflows/qc06-channel-tests.yml'
  pull_request:
    paths:
      - 'experiments/channel_mpo/**'
      - '.github/workflows/qc06-channel-tests.yml'

jobs:
  qc06-cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Quantum channels QC-01 to QC-06 unit tests
        working-directory: experiments/channel_mpo
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m unittest -q test_channel_mpo test_purified_mpo test_qc03 test_qc04 test_qc05 test_qc06
      - name: Matched-budget smoke test
        working-directory: experiments/channel_mpo
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python benchmark_qc06.py --qubits 6 --strengths 0.2 --seeds 0 --depth 6 --frozen-budgets qc06_budget_schedule.json --output /tmp/qc06_smoke.csv
