name: HAD-QFT-QPU01 offline verification
on:
  pull_request:
    paths:
      - 'experiments/hadamard_qft/qft01/**'
      - '.github/workflows/had-qft-qpu01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy pytest qiskit==2.6.2 stim==1.16.0
      - run: python -m pytest -q test_qpu01.py
        working-directory: experiments/hadamard_qft/qft01
