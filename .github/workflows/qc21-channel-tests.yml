name: QC-21 small-memory dyadic verification
on:
  push:
    paths:
      - 'experiments/channel_mpo/**'
      - '.github/workflows/qc21-channel-tests.yml'
  pull_request:
    paths:
      - 'experiments/channel_mpo/**'
      - '.github/workflows/qc21-channel-tests.yml'

jobs:
  standalone-stdlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: QC-21 no-site independent witness replay and adversarial tests
        shell: bash
        run: |
          cd experiments/channel_mpo
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('qc18_certificates/10q_d6_mmap.zip') as z:
              z.extractall('/tmp/qc21-ten-qubits')
          PY
          python -I -S qc21_checker.py /tmp/qc21-ten-qubits/manifest.json --workers 2 --start-method fork
          python -I -S qc21_checker.py /tmp/qc21-ten-qubits/manifest.json --workers 2 --start-method spawn
          python -m unittest -q test_qc20 test_qc21

  numerical-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3'
      - name: QC-21 and parent verifier regression
        shell: bash
        run: |
          cd experiments/channel_mpo
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1
          python -m unittest -q test_qc15 test_qc16 test_qc17 test_qc18 \
            test_qc19 test_qc20 test_qc21
