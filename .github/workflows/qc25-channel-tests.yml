name: QC-25 heterogeneous CPTP-MPO
on:
  push:
    paths:
      - 'experiments/channel_mpo/ibm_qc23/qc25/**'
      - '.github/workflows/qc25-channel-tests.yml'
  pull_request:
    paths:
      - 'experiments/channel_mpo/ibm_qc23/qc25/**'
      - '.github/workflows/qc25-channel-tests.yml'
  workflow_dispatch:
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - run: python experiments/channel_mpo/ibm_qc23/qc25/qc25_bench.py /tmp/qc25.json
  native-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/channel_mpo/ibm_qc23/requirements-qc23.txt
      - run: python experiments/channel_mpo/ibm_qc23/qc25/qc25_native_smoke.py
