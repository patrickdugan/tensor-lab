name: QC-25B IBM counts offline replay
on:
  push:
    paths:
      - 'experiments/channel_mpo/ibm_qc23/qc25/qc25_replay.py'
      - 'experiments/channel_mpo/ibm_qc23/qc25/qc25_channels.py'
      - '.github/workflows/qc25b-replay.yml'
  pull_request:
    paths:
      - 'experiments/channel_mpo/ibm_qc23/qc25/qc25_replay.py'
      - 'experiments/channel_mpo/ibm_qc23/qc25/qc25_channels.py'
      - '.github/workflows/qc25b-replay.yml'
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {set: eval_echo, width: 8}
          - {set: eval_echo, width: 16}
          - {set: nc_eval, width: 8}
          - {set: nc_eval, width: 12}
          - {set: nc_eval, width: 16}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/channel_mpo/ibm_qc23/requirements-qc23.txt
      - run: python experiments/channel_mpo/ibm_qc23/qc25/qc25_replay.py --set ${{ matrix.set }} --width ${{ matrix.width }} --out /tmp/replay.json
      - name: Reproduce independent sparse oracle and verify hashes
        if: matrix.set == 'nc_eval' && matrix.width == 12
        run: |
          node experiments/channel_mpo/ibm_qc23/qc25/qc25b_sparse_spotcheck.mjs /tmp/sparse.json
          python -c "import json; a=json.load(open('/tmp/sparse.json')); b=json.load(open('experiments/channel_mpo/ibm_qc23/qc25/qc25b_sparse_spotcheck.json')); assert len(a['rows'])==len(b['rows'])==24; assert all(x['id']==y['id'] and x['bit']==y['bit'] and abs(x['native_A']-y['native_A'])<1e-10 for x,y in zip(a['rows'],b['rows']))"
      - uses: actions/upload-artifact@v4
        with:
          name: replay-${{ matrix.set }}-${{ matrix.width }}
          path: /tmp/replay.json
