name: QC-05 global quantum-channel proxy tests
on:
  push:
    paths:
      - 'experiments/channel_mpo/**'
      - '.github/workflows/qc05-channel-tests.yml'
  pull_request:
    paths:
      - 'experiments/channel_mpo/**'
      - '.github/workflows/qc05-channel-tests.yml'
jobs:
  channel-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small CPU dependencies
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Test QC-01 through QC-05
        working-directory: experiments/channel_mpo
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m unittest -q test_channel_mpo test_purified_mpo test_qc03 test_qc04 test_qc05
