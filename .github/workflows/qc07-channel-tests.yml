name: QC-07 channel rank tests
on:
  push:
    paths:
      - 'experiments/channel_mpo/**'
      - '.github/workflows/qc07-channel-tests.yml'
  pull_request:
    paths:
      - 'experiments/channel_mpo/**'
      - '.github/workflows/qc07-channel-tests.yml'
  workflow_dispatch:
jobs:
  numerical-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3'
      - name: Test QC01 through QC07
        working-directory: experiments/channel_mpo
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m unittest -q test_channel_mpo test_purified_mpo test_qc03 test_qc04 test_qc05 test_qc06 test_qc07
      - name: Budgeted 6-qubit smoke comparison
        working-directory: experiments/channel_mpo
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python benchmark_qc07.py --qubits 6 --strengths 0.2 --seeds 0 --work-cap-entries 500000 --output /tmp/qc07_smoke.csv
