name: QC-14 end-to-end dyadic observable audits
on:
  push:
    paths:
      - 'experiments/channel_mpo/**'
      - '.github/workflows/qc14-channel-tests.yml'
  pull_request:
    paths:
      - 'experiments/channel_mpo/**'
      - '.github/workflows/qc14-channel-tests.yml'
  workflow_dispatch:
jobs:
  dyadic-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Complete QC-01 through QC-14 tests
        working-directory: experiments/channel_mpo
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m unittest -q test_channel_mpo test_purified_mpo test_qc03 test_qc04 test_qc05 test_qc06 test_qc07 test_qc08 test_qc09 test_qc10 test_qc11 test_qc12 test_qc13 test_qc14
      - name: Reproduce generic polar-physical end-to-end smoke
        working-directory: experiments/channel_mpo
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python benchmark_qc14.py --grid quick --output /tmp/qc14_quick_ci.csv
