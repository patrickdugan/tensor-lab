name: PGC-QPU01 local identifiability
on:
  pull_request:
    paths:
      - 'experiments/channel_mpo/ibm_qc23/pgc_qpu/**'
      - 'experiments/channel_mpo/ibm_qc23/qc26/qc26b_*.mjs'
      - 'experiments/channel_mpo/ibm_qc23/qc26/qc26b_prospective_plan.py'
      - 'experiments/channel_mpo/ibm_qc23/qc26/test_qc26b_prospective.py'
      - '.github/workflows/pgc-qpu01.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/channel_mpo/ibm_qc23/pgc_qpu/**'
      - '.github/workflows/pgc-qpu01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node experiments/channel_mpo/ibm_qc23/pgc_qpu/audit.mjs --check
      - run: node experiments/channel_mpo/ibm_qc23/pgc_qpu/ramsey_campaign.mjs --check
      - run: python -m pip install -r experiments/channel_mpo/ibm_qc23/requirements-qc23.txt pytest
      - name: Independent NumPy SVD rank check of the committed Jacobian
        run: python experiments/channel_mpo/ibm_qc23/pgc_qpu/analysis/jacobian_svd_check.py > /dev/null
      - name: Ramsey estimator, submit-adapter gates and QPU02 offline tests
        working-directory: experiments/channel_mpo/ibm_qc23/pgc_qpu
        run: python -m pytest test_pgc_ramsey.py test_ramsey_modelcheck.py qpu02/test_qpu02.py -q
      - name: QC-26B prospective freeze/scoring regressions
        working-directory: experiments/channel_mpo/ibm_qc23/qc26
        run: python -m unittest test_qc26b_prospective -v
      - name: Run exploratory Ramsey model checks on archived counts
        working-directory: experiments/channel_mpo/ibm_qc23/pgc_qpu
        run: |
          for block in q5 q23; do
            python ramsey_modelcheck.py --compiled receipts/live_20261127/$block/compiled.json --counts receipts/live_20261127/$block/counts.json --out /tmp/modelcheck_$block.json
          done
      - name: Replay nonlinear Bayesian design pilot
        working-directory: experiments/channel_mpo/ibm_qc23/pgc_qpu/bpd/nonlinear
        run: |
          node bpd_qpu02.mjs 32 > /tmp/bpd_qpu02.json
          node check_pilot.mjs pilot_32.json /tmp/bpd_qpu02.json
      - name: Replay cross-edge grouping and residual refinement pilots
        working-directory: experiments/channel_mpo/ibm_qc23/pgc_qpu/bpd/nonlinear
        run: |
          node bpd_qpu03.mjs 24 > /tmp/qpu03.json
          node check_qpu03.mjs qpu03_pilot_24.json /tmp/qpu03.json
          node bpd_qpu03b.mjs 24 > /tmp/qpu03b.json
          node check_qpu03.mjs qpu03b_pilot_24.json /tmp/qpu03b.json
