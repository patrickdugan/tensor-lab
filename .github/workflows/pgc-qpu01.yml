name: PGC-QPU01 local identifiability
on:
  pull_request:
    paths:
      - 'experiments/channel_mpo/ibm_qc23/pgc_qpu/**'
      - 'experiments/channel_mpo/ibm_qc23/qc26/qc26b_engine.mjs'
      - '.github/workflows/pgc-qpu01.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/channel_mpo/ibm_qc23/pgc_qpu/**'
      - '.github/workflows/pgc-qpu01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node experiments/channel_mpo/ibm_qc23/pgc_qpu/audit.mjs --check
      - run: node experiments/channel_mpo/ibm_qc23/pgc_qpu/ramsey_campaign.mjs --check
      - run: python -m pip install -r experiments/channel_mpo/ibm_qc23/requirements-qc23.txt pytest
      - name: Independent NumPy SVD rank check of the committed Jacobian
        run: python experiments/channel_mpo/ibm_qc23/pgc_qpu/analysis/jacobian_svd_check.py > /dev/null
      - name: Ramsey estimator, submit-adapter gates and QPU02 offline tests
        working-directory: experiments/channel_mpo/ibm_qc23/pgc_qpu
        run: python -m pytest test_pgc_ramsey.py qpu02/test_qpu02.py -q
