name: QC-03 quantum-channel CPU tests
on:
  push:
    paths:
      - 'experiments/channel_mpo/**'
      - '.github/workflows/qc03-channel-tests.yml'
  pull_request:
    paths:
      - 'experiments/channel_mpo/**'
      - '.github/workflows/qc03-channel-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Run QC-01, QC-02, QC-03 correctness tests
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        working-directory: experiments/channel_mpo
        run: python -m unittest -q test_channel_mpo test_purified_mpo test_qc03
