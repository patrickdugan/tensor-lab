name: QC-12 Heisenberg observable-MPO tests
on:
  push:
    paths:
      - 'experiments/channel_mpo/**'
      - '.github/workflows/qc12-channel-tests.yml'
  pull_request:
    paths:
      - 'experiments/channel_mpo/**'
      - '.github/workflows/qc12-channel-tests.yml'
  workflow_dispatch:
jobs:
  numerical-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Test QC-01 through QC-12
        working-directory: experiments/channel_mpo
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m unittest -q test_channel_mpo test_purified_mpo test_qc03 test_qc04 test_qc05 test_qc06 test_qc07 test_qc08 test_qc09 test_qc10 test_qc11 test_qc12
      - name: Deep 48-qubit observable and residual smoke
        working-directory: experiments/channel_mpo
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python benchmark_qc12.py --mode deep --depths 16 --seeds 3 --targets 22 --caps 8 --channels dephasing --strengths .5 --output /tmp/qc12_smoke.csv
