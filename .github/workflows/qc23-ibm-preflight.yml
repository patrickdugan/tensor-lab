name: QC-23 IBM hardware preflight
on:
  push:
    paths:
      - 'experiments/channel_mpo/ibm_qc23/**'
      - '.github/workflows/qc23-ibm-preflight.yml'
  pull_request:
    paths:
      - 'experiments/channel_mpo/ibm_qc23/**'
      - '.github/workflows/qc23-ibm-preflight.yml'
  workflow_dispatch:
jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test without Qiskit or IBM credentials
        working-directory: experiments/channel_mpo/ibm_qc23
        run: |
          python -m unittest -v test_qc23.py
          python -m py_compile qc23_ibm.py test_qc23.py
          python qc23_ibm.py plan --out /tmp/qc23_plan
          python -c "import json; rows=json.load(open('/tmp/qc23_plan/plan.json')); assert len(rows)==12; assert all(row['shots']==2048 for row in rows)"

  qiskit-local-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qiskit locally
        run: python -m pip install 'qiskit>=2.2,<3'
      - name: Prove echo identity using statevector
        working-directory: experiments/channel_mpo/ibm_qc23
        run: |
          python - <<'PY'
          from qiskit.quantum_info import Statevector
          from qc23_ibm import make_echo
          for n in (2, 4, 8):
              for depth in (1, 2, 4):
                  for seed in (3, 5):
                      psi = Statevector.from_instruction(make_echo(n, depth, seed))
                      assert abs(abs(psi.data[0]) - 1) < 1e-10
                      assert sum(abs(x)**2 for x in psi.data[1:]) < 1e-18
          PY
